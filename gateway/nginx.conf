server {
    listen 8080;
    server_name _;

    # Normalize /mfe to /mfe/
    location = /mfe {
        return 301 /mfe/;
    }

    # Serve the Shell for the Angular route /mfe/
    location = /mfe/ {
        proxy_pass http://shell:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve MFE federation artifacts under /mfe/
    # /mfe/remoteEntry.json -> mfe:8080/remoteEntry.json
    # /mfe/main-xxxxx.js    -> mfe:8080/main-xxxxx.js
    location /mfe/ {
        proxy_pass http://mfe:8080/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Shell application and other client-side routes
    location / {
        proxy_pass http://shell:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}